[package]
name = "nostr-proxy-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
nostr-proxy = { path = "..", default-features = false }
url = "2"
worker = "0.8.3"
